{{- if and .Values.probe.apiToken (not .Values.probe.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sm-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sm-agent.labels" (dict "ctx" . "component" "agent") | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ .Values.probe.apiToken | quote }}
{{- end }}
