{{- if and (include "sm-agent.browserPoolEnabled" .) .Values.browserPool.crocochrome.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sm-agent.crocochromeServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sm-agent.labels" (dict "ctx" . "component" "crocochrome" "version" .Values.browserPool.crocochrome.image.tag) | nindent 4 }}
  {{- with .Values.browserPool.crocochrome.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# crocochrome doesn't use the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
