{{- if and .Values.podDisruptionBudget.enabled .Values.cluster.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sm-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sm-agent.labels" (dict "ctx" . "component" "agent") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  # Agents that aren't Ready can always be evicted, so a crash-looping agent doesn't block node drains.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "sm-agent.selectorLabels" (dict "ctx" . "component" "agent") | nindent 6 }}
{{- end }}
