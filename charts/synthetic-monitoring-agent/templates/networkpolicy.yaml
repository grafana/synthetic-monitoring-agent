{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sm-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sm-agent.labels" (dict "ctx" . "component" "agent") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sm-agent.selectorLabels" (dict "ctx" . "component" "agent") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http-metrics
          protocol: TCP
      {{- with .Values.networkPolicy.extraIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.cluster.enabled }}
    - ports:
        - port: gossip
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "sm-agent.selectorLabels" (dict "ctx" . "component" "agent") | nindent 14 }}
    {{- end }}
{{- end }}
