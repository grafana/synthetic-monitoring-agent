apiVersion: v1
kind: Service
metadata:
  name: crocochrome
  namespace: synthetic-monitoring
spec:
  # The Service must be headless so that the agent can address each crocochrome instance individually.
  clusterIP: None
  selector:
    name: crocochrome
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
