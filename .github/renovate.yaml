"$schema": "https://docs.renovatebot.com/renovate-schema.json"

extends:
  - "github>grafana/sm-renovate//presets/grafana.json5"
  - "github>grafana/sm-renovate//presets/synthetic-monitoring.json5"
  - "github>grafana/sm-renovate//presets/go.json5"
  - "github>grafana/sm-renovate//presets/grafana-build-tools.json5"

ignorePresets:
  - "github>grafana/grafana-renovate-config//presets/shared-workflows"
  - "github>grafana/grafana-renovate-config//presets/automerge"

packageRules:
  - # The default "docker" versioning will try to restrict upgrades to versions
    # that do not change everything after a dash (-) for the current tag, as
    # this typically indicates the "flavor" (e.g. postgresql:17.1-alpine will
    # not be upgraded to postgresql:17.2-debian).
    #
    # This image in particular has lots of dashes and does not follow this
    # convention, so we force "loose" versioning which is pretty much an
    # alphabetical sort.
    matchPackageNames:
      - "ghcr.io/grafana/chromium-swiftshader-alpine"
    versioning: loose

  - matchDepNames:
      - "grafana/xk6-sm-v1"
    allowedVersions: "<2.0.0"

  - matchDepNames:
      - "grafana/xk6-sm-v2"
    allowedVersions: ">=2.0.0 <3.0.0"

  - # Bump the chart version with its default images, so the chart release
    # workflow publishes the update. Don't pin digests: the chart appends
    # suffixes (-browser, -unprivileged) to these tags.
    #
    # Also bump the version badge in the generated README, so it stays in sync
    # with helm-docs. Each badge string needs its own entry: entries apply in
    # order, but each one replaces only its first match.
    matchDepNames:
      - "grafana/synthetic-monitoring-agent"
      - "ghcr.io/grafana/crocochrome"
    matchFileNames:
      - "charts/synthetic-monitoring-agent/Chart.yaml"
      - "charts/synthetic-monitoring-agent/values.yaml"
      - "charts/synthetic-monitoring-agent/README.md"
    pinDigests: false
    bumpVersions:
      - filePatterns:
          - "charts/synthetic-monitoring-agent/Chart.yaml"
        matchStrings:
          - "(^|\\n)version: (?<version>\\S+)"
        bumpType: "patch"
      - filePatterns:
          - "charts/synthetic-monitoring-agent/README.md"
        matchStrings:
          - "!\\[Version: (?<version>[^\\]]+)\\]"
        bumpType: "patch"
      - filePatterns:
          - "charts/synthetic-monitoring-agent/README.md"
        matchStrings:
          - "badge/Version-(?<version>[^-]+)-informational"
        bumpType: "patch"

customManagers:
  - customType: "regex"
    depNameTemplate: "grafana/xk6-sm-v1"
    packageNameTemplate: "grafana/xk6-sm"
    datasourceTemplate: "github-releases"
    versioningTemplate: "semver"
    managerFilePatterns:
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "**/*.mk"
    matchStrings:
      - "K6_V1_VERSION=(?<currentValue>\\S+)"

  - customType: "regex"
    depNameTemplate: "grafana/xk6-sm-v2"
    packageNameTemplate: "grafana/xk6-sm"
    datasourceTemplate: "github-releases"
    versioningTemplate: "semver"
    managerFilePatterns:
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "**/*.mk"
    matchStrings:
      - "K6_V2_VERSION=(?<currentValue>\\S+)"

  - customType: "regex"
    depNameTemplate: "grafana/synthetic-monitoring-agent"
    datasourceTemplate: "docker"
    managerFilePatterns:
      - "charts/synthetic-monitoring-agent/Chart.yaml"
    matchStrings:
      - "(^|\\n)appVersion: \"?(?<currentValue>[^\"\\s]+)\"?"

  - # The org config disables the helm-values manager, so read the image tags
    # that have a "# renovate:" comment above their repository.
    customType: "regex"
    managerFilePatterns:
      - "charts/synthetic-monitoring-agent/values.yaml"
    matchStrings:
      - "# renovate: datasource=(?<datasource>\\S+) depName=(?<depName>\\S+)\\n(?:[ \\t]*(?:#.*|repository: \\S+)\\n)*[ \\t]*tag: \"?(?<currentValue>[^\"\\s]+)\"?"

  - # The chart README, generated by helm-docs, shows the agent appVersion in
    # its AppVersion badge and the crocochrome tag in its values table. Update
    # them in the same PR as Chart.yaml and values.yaml, so the README check
    # passes.
    customType: "regex"
    depNameTemplate: "grafana/synthetic-monitoring-agent"
    datasourceTemplate: "docker"
    managerFilePatterns:
      - "charts/synthetic-monitoring-agent/README.md"
    matchStrings:
      - "!\\[AppVersion: (?<currentValue>[^\\]]+)\\]"
      - "badge/AppVersion-(?<currentValue>[^-]+)-informational"

  - customType: "regex"
    depNameTemplate: "ghcr.io/grafana/crocochrome"
    datasourceTemplate: "docker"
    managerFilePatterns:
      - "charts/synthetic-monitoring-agent/README.md"
    matchStrings:
      - "browserPool\\.crocochrome\\.image\\.tag \\| string \\| `\"(?<currentValue>[^\"]+)\"`"
